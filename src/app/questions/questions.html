<div class="accordion">
  <h2 class="ques-title" id="faq-heading">Frequently Asked Questions</h2>

  @for (item of faqs; track $index; let i = $index) {
    <div class="accordion-item">
      <h3 class="accordion-title">
        <button class="accordion-header" type="button" (click)="toggle(i)"
          [attr.aria-expanded]="item.open"
          [attr.aria-controls]="'faq-panel-' + i"
          [attr.id]="'faq-button-' + i">
          <span>{{ item.question }}</span>
          <span class="icon" aria-hidden="true">{{ item.open ? '−' : '+' }}</span>
        </button>
      </h3>

      @if (item.open) {
        <div class="accordion-body" [attr.id]="'faq-panel-' + i"
          [attr.role]="'region'" [attr.aria-labelledby]="'faq-button-' + i">
          <p>{{ item.answer }}</p>
        </div>
      }
    </div>
  }
</div>
